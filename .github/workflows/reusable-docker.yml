name: Reusable Docker Build, Scan and Push

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker image repository name
        required: true
        type: string
      tag:
        description: Primary Docker image tag
        required: true
        type: string
    secrets:
      docker_username:
        required: true
      docker_token:
        required: true
    outputs:
      image_url:
        description: Published Docker image URL
        value: ${{ jobs.docker.outputs.image_url }}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image URL
        id: image
        env:
          DOCKER_USERNAME: ${{ secrets.docker_username }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          echo "image_url=docker.io/${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate short SHA
        id: short-sha
        run: |
          echo "tag=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.docker_username }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |

          docker buildx build \
            --load \
            --tag "${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}" \
            --tag "${DOCKER_USERNAME}/${IMAGE_NAME}:${{ steps.short-sha.outputs.tag }}" \
            .

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      - name: Push Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.docker_username }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.tag }}
          SHORT_SHA: ${{ steps.short-sha.outputs.tag }}
        run: |
          docker push "${DOCKER_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${DOCKER_USERNAME}/${IMAGE_NAME}:${SHORT_SHA}"
