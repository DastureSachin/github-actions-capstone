
name: Scheduled Health Check

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull latest image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker pull "${DOCKER_USERNAME}/github-actions-capstone:latest"

      - name: Start container
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker run -d --name capstone-health \
            -p 127.0.0.1:5000:5000 \
            "${DOCKER_USERNAME}/github-actions-capstone:latest"

      - name: Check health endpoint
        id: health
        run: |
          sleep 5
          if curl --fail --silent http://127.0.0.1:5000/health; then
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
            echo "Health check passed."
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            docker logs capstone-health
            exit 1
          fi

      - name: Stop and remove container
        if: always()
        run: docker rm -f capstone-health || true

      - name: Write health check summary
        if: always()
        env:
          HEALTH_STATUS: ${{ steps.health.outputs.status }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          echo "## Health Check Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${DOCKER_USERNAME}/github-actions-capstone:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${HEALTH_STATUS:-FAILED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Time: $(date -u)" >> "$GITHUB_STEP_SUMMARY"

